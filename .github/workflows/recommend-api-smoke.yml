name: Recommender API Smoke Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run recommender smoke test
        env:
          RECOMMENDER_API_BASE_URL: ${{ secrets.RECOMMENDER_API_BASE_URL }}
        run: |
          if [ -z "$RECOMMENDER_API_BASE_URL" ]; then
            echo "RECOMMENDER_API_BASE_URL is not set; skipping smoke test."
            exit 0
          fi
          API_BASE_URL="$RECOMMENDER_API_BASE_URL" npm run test:recommend
